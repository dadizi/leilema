    <style>
        .page-title {
            font-size: clamp(28px, 5vw, 36px); 
            font-weight: 300; 
            color: #f5ede0;
            margin-bottom: 8px; 
            letter-spacing: 0.04em;
        }

        .page-intro {
            font-size: 15px; 
            color: var(--text-muted); 
            margin-bottom: 40px;
            font-style: italic; 
            font-family: var(--font-serif);
            line-height: 1.8;
        }

        .list-card {
            background: var(--bg-card); 
            border-radius: var(--radius); 
            padding: 26px 24px;
            border: 1px solid var(--border); 
            transition: all var(--transition); 
            display: block;
            text-decoration: none; 
            color: inherit; 
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }

        .list-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .list-card:hover {
            background: var(--bg-card-alt); 
            border-color: rgba(201,154,122,0.35);
            transform: translateY(-3px); 
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
        }

        .list-card:hover::before {
            opacity: 0.7;
        }

        .list-card-tag {
            font-size: 10px; 
            letter-spacing: 0.12em; 
            color: var(--text-dim); 
            text-transform: uppercase;
            font-family: var(--font-en); 
            margin-bottom: 8px;
            font-weight: 500;
        }

        .list-card-title { 
            font-size: 17px; 
            font-weight: 500; 
            color: #ebe3d8; 
            margin-bottom: 8px;
            letter-spacing: 0.03em;
        }

        .list-card-desc { 
            font-size: 14px; 
            color: var(--text-muted); 
            line-height: 1.6;
        }

        .footer-nav {
            margin-top: 56px; 
            display: flex; 
            justify-content: center;
        }

        .footer-nav a {
            font-size: 12px; 
            color: var(--text-dim); 
            text-decoration: none; 
            opacity: 0.5;
            transition: all var(--transition-fast); 
            letter-spacing: 0.06em;
            font-family: var(--font-en);
        }
        .footer-nav a:hover { 
            opacity: 1; 
            color: var(--accent); 
        }

        @media (max-width: 600px) {
            .page { padding: 40px 16px 60px; }
            .page-title { font-size: 24px; }
            .list-card { padding: 22px 20px; }
            .list-card-title { font-size: 16px; }
            .list-card-desc { font-size: 13px; }
        }
    </style>
