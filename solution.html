      }
    };
    
    const type = localStorage.getItem('fatigueType');
    const level = localStorage.getItem('severityLevel');
    const key = type ? (type + '_' + (level || 'mild')) : null;
    
    if (!type || !solutions[key]) {
      document.getElementById('noRes').style.display = 'block';
    } else {
      document.getElementById('noRes').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      const d = solutions[key];
      document.getElementById('intro').textContent = d.i;
      document.getElementById('note').innerHTML = d.n;
      for (let j = 0; j < 3; j++) {
        document.getElementById('ico' + (j + 1)).textContent = d.s[j][0];
        document.getElementById('ti' + (j + 1)).textContent = d.s[j][1];
        document.getElementById('de' + (j + 1)).textContent = d.s[j][2];
        document.getElementById('ac' + (j + 1)).textContent = d.s[j][3];
      }
      let cur = 0;
      const steps = document.querySelectorAll('.step');
      const prev = document.getElementById('prevBtn');
      const next = document.getElementById('nextBtn');
      const note = document.getElementById('note');
      function upd() {
        // 确保步骤可见
        steps.forEach(s => s.style.display = '');
        // 设置当前活动步骤
        steps.forEach((s, i) => s.classList.toggle('active', i === cur));
        prev.disabled = cur === 0;
        
        if (cur < 3) {
          next.textContent = cur < 2 ? '下一步' : '听听悄悄话';
          note.style.display = 'none';
        } else {
          next.textContent = '完成啦';
          note.style.display = 'block';
          // 只在显示悄悄话时隐藏步骤
          steps.forEach(s => s.style.display = 'none');
        }
      }
      prev.onclick = () => { 
        if (cur > 0) { 
          cur--; 
          upd(); 
        } 
      };
      next.onclick = () => { 
        if (cur < 3) { 
          cur++; 
          upd(); 
        } else {
          // 完成后不弹窗，而是可以回到首页或其他页面
          alert('你已经完成所有步骤啦！记得每天都要对自己好一点哦 💖');
        }
      };
      upd();
    }
    
    document.querySelectorAll('a').forEach(a => { a.onclick = e => { e.preventDefault(); location.href = a.href; }; });
  </script>
</body>
</html>
