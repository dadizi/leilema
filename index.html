<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>累了吗? - leilema.cn</title>

  <style>
    :root {
      --bg: #0b1020;
      --ball-color: #8b7fc7;
      --ball-glow: rgba(139,127,199,0.35);
      --text: #e5e7eb;
      --muted: #6b7280;
      --card-bg: rgba(255,255,255,0.05);
      --card-border: rgba(255,255,255,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========== 场景切换 ========== */
    .scene {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ========== 场景1：呼吸 ========== */
    .ball-wrapper {
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ball {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b8a9e8, #6d5fa8);
      box-shadow: 0 0 80px var(--ball-glow);
      animation: breathe 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transition: box-shadow 0.5s;
      cursor: pointer;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      40% { transform: scale(1.55); opacity: 1; }
      100% { transform: scale(1); opacity: 0.75; }
    }
    .breath-text {
      color: var(--text);
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      margin-top: 1.5rem;
      min-height: 2em;
      text-align: center;
      transition: opacity 0.3s;
      font-weight: 300;
    }

    /* ========== 场景2：对自己说一句话 ========== */
    .kindness-box {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .kindness-box .prompt {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    .kindness-box textarea {
      width: 100%;
      min-height: 110px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text);
      padding: 1rem;
      font-size: 1rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .kindness-box textarea:focus {
      border-color: var(--ball-color);
    }
    .kindness-box .send-btn {
      margin-top: 1rem;
      background: var(--ball-color);
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      font-family: inherit;
    }
    .kindness-box .send-btn:hover { background: #6d5fa8; }
    .kindness-box .send-btn:active { transform: scale(0.96); }

    /* ========== 底部导航 ========== */
    .nav {
      position: fixed;
      bottom: 36px;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      z-index: 20;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      padding: 0.5rem 0.8rem;
      transition: color 0.3s;
      font-family: inherit;
    }
    .nav-btn.active {
      color: var(--text);
    }
    .nav-btn:hover {
      color: var(--text);
    }

    /* ========== 声波按钮（导航内） ========== */
    .sound-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      align-self: center;
      position: relative;
    }
    .sound-btn:active {
      transform: scale(0.9);
    }
    .sound-btn.active {
      background: rgba(139,127,199,0.25);
      border-color: var(--ball-color);
    }
    .sound-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--text);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sound-btn.active svg {
      stroke: #b8a9e8;
    }
    .sound-btn.active::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--ball-color);
      animation: ripple 2s infinite ease-out;
    }
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* ========== 飞走的纸飞机 ========== */
    .plane {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.92);
      color: #333;
      padding: 0.8rem 1.5rem;
      border-radius: 20px;
      max-width: 80%;
      word-break: break-word;
      font-size: 0.95rem;
      animation: flyUp 4s ease-in forwards;
      z-index: 200;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    @keyframes flyUp {
      0% { bottom: 100px; opacity: 1; transform: translateX(-50%) scale(1); }
      100% { bottom: 95vh; opacity: 0; transform: translateX(-50%) scale(0.8); }
    }
  </style>
</head>
<body>

  <!-- ========== 场景1：呼吸 ========== -->
  <div class="scene active" id="scene-breath">
    <div class="ball-wrapper">
      <div class="ball" id="ball"></div>
    </div>
    <div class="breath-text" id="breath-phase">吸气</div>
  </div>

  <!-- ========== 场景2：对自己说一句话 ========== -->
  <div class="scene" id="scene-kindness">
    <div class="kindness-box">
      <p class="prompt">
        写一句接纳自己的话，<br>
        写什么都可以。写完它会飘走。
      </p>
      <textarea id="kindness-input" placeholder="例如：今天累了就累了，没关系。"></textarea>
      <button class="send-btn" id="kindness-send">让它飘走</button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="nav">
    <button class="nav-btn active" data-scene="breath">呼吸</button>
    <button class="nav-btn" data-scene="kindness">说一句话</button>
    <button class="sound-btn" id="sound-toggle" aria-label="声音开关">
      <svg viewBox="0 0 24 24">
        <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/>
        <path d="M15 9a4 4 0 010 6" />
        <path d="M18 7a8 8 0 010 10" />
      </svg>
    </button>
  </div>

  <script>
    (function() {
      // ========== 呼吸同步 ==========
      const breathPhaseEl = document.getElementById('breath-phase');
      const ball = document.getElementById('ball');
      const CYCLE = 10;
      let breathStart = Date.now();

      function updateBreathPhase() {
        const elapsed = (Date.now() - breathStart) / 1000;
        const cycle = elapsed % CYCLE;
        if (cycle < 4) {
          breathPhaseEl.textContent = '吸气';
        } else {
          breathPhaseEl.textContent = '呼气';
        }
      }
      setInterval(updateBreathPhase, 100);

      ball.addEventListener('click', () => {
        breathStart = Date.now();
        ball.style.animation = 'none';
        void ball.offsetWidth;
        ball.style.animation = '';
      });

      // ========== 场景切换 ==========
      const scenes = {
        breath: document.getElementById('scene-breath'),
        kindness: document.getElementById('scene-kindness')
      };
      const navBtns = document.querySelectorAll('.nav-btn');

      function showScene(name) {
        Object.keys(scenes).forEach(k => {
          scenes[k].classList.toggle('active', k === name);
        });
        navBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.scene === name);
        });
      }

      navBtns.forEach(btn => {
        btn.addEventListener('click', () => showScene(btn.dataset.scene));
      });

      // ========== 树洞 ==========
      document.getElementById('kindness-send').addEventListener('click', () => {
        const input = document.getElementById('kindness-input');
        const text = input.value.trim();
        if (!text) return;
        const plane = document.createElement('div');
        plane.className = 'plane';
        plane.textContent = text;
        document.body.appendChild(plane);
        setTimeout(() => plane.remove(), 4000);
        input.value = '';
      });

      // ========== 声音（HTML5 Audio 粉红噪音） ==========
      const soundBtn = document.getElementById('sound-toggle');
      let noiseAudio = null;
      let isPlaying = false;

      function generatePinkNoiseWav(durationSec, sampleRate) {
        const numSamples = Math.floor(durationSec * sampleRate);
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        function writeString(offset, str) {
          for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
          }
        }
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, numSamples * 2, true);

        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < numSamples; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          const pink = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
          b6 = white * 0.115926;
          const sample = Math.max(-1, Math.min(1, pink));
          view.setInt16(44 + i * 2, sample * 0x7FFF, true);
        }
        return new Blob([buffer], { type: 'audio/wav' });
      }

      function startNoise() {
        if (noiseAudio) {
          noiseAudio.play().catch(() => {});
          isPlaying = true;
          soundBtn.classList.add('active');
          return;
        }
        const wavBlob = generatePinkNoiseWav(30, 22050);
        const url = URL.createObjectURL(wavBlob);
        noiseAudio = new Audio(url);
        noiseAudio.loop = true;
        noiseAudio.volume = 0.7;
        noiseAudio.play().then(() => {
          isPlaying = true;
          soundBtn.classList.add('active');
        }).catch(() => {});
      }

      function stopNoise() {
        if (noiseAudio) {
          noiseAudio.pause();
          noiseAudio.currentTime = 0;
        }
        isPlaying = false;
        soundBtn.classList.remove('active');
      }

      soundBtn.addEventListener('click', () => {
        if (isPlaying) stopNoise();
        else startNoise();
      });

      window.addEventListener('beforeunload', () => {
        if (noiseAudio) {
          noiseAudio.pause();
          if (noiseAudio.src) URL.revokeObjectURL(noiseAudio.src);
        }
      });
    })();
  </script>
</body>
</html>
