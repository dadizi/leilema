<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070a">
<title>累了吗？- leilema.cn</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;overflow:hidden;background:#08070a;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  body{display:grid;place-items:center;color:#fff;user-select:none}

  body::before{
    content:'';position:fixed;inset:-20%;
    background:radial-gradient(circle at 50% 46%, rgba(255,180,130,.05), transparent 55%);
    pointer-events:none;
  }

  .stage{position:relative;width:100%;height:100%;display:grid;place-items:center}

  .drift{
    position:relative;
    opacity:0;
    animation:drift 46s ease-in-out infinite, fadeIn 3.2s ease .4s forwards;
    will-change:transform;
  }
  @keyframes fadeIn{to{opacity:1}}
  @keyframes drift{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(1.8vmin,-1.4vmin)}
    50%{transform:translate(.4vmin,2vmin)}
    75%{transform:translate(-1.9vmin,-.8vmin)}
  }

  .breathe{
    position:relative;
    width:58vmin;height:58vmin;max-width:460px;max-height:460px;
    display:grid;place-items:center;
    transform:scale(.62);opacity:.5;
    transition-property:transform,opacity;
    transition-timing-function:cubic-bezier(.37,0,.63,1);
    transition-duration:4s;
    will-change:transform,opacity;
  }

  .halo{
    position:absolute;inset:-38%;border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,178,128,.17) 0%,
      rgba(255,150,110,.06) 38%,
      transparent 66%);
    filter:blur(28px);
  }

  .core{
    position:absolute;inset:14%;border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,228,198,.95) 0%,
      rgba(255,192,142,.58) 18%,
      rgba(255,158,110,.2) 40%,
      rgba(255,140,100,.05) 58%,
      transparent 72%);
    filter:blur(10px);
  }

  .spark{
    position:absolute;width:13%;height:13%;border-radius:50%;
    background:radial-gradient(circle,
      rgba(255,244,232,.92) 0%,
      rgba(255,214,176,.28) 58%,
      transparent 74%);
    filter:blur(6px);
  }

  /* 文字区域：光球正下方，引导和呼吸提示共用同一位置 */
  .text-area{
    position:absolute;
    left:0;right:0;
    top:100%;
    margin-top:3vmin;
    height:3em;
    pointer-events:none;
  }
  .text-area > *{
    position:absolute;
    left:50%;top:0;
    transform:translateX(-50%);
    white-space:nowrap;
    opacity:0;
    will-change:opacity;
  }

  /* 引导文字：两行，淡入淡出 1.4s */
  .guide-text{
    text-align:center;
    transition:opacity 1.4s ease;
  }
  .guide-text.show{opacity:1}
  .guide-text .line1{
    display:block;
    font-size:clamp(14px,1.9vmin,17px);
    letter-spacing:.24em;
    padding-left:.24em;
    font-weight:300;
    color:rgba(255,238,222,.55);
  }
  .guide-text .line2{
    display:block;
    margin-top:10px;
    font-size:clamp(11px,1.4vmin,12.5px);
    letter-spacing:.18em;
    padding-left:.18em;
    font-weight:300;
    color:rgba(255,238,222,.22);
  }

  /* 呼吸提示：吸 / 呼，两轮显示，第二轮更淡 */
  .breath-word{
    font-size:clamp(13px,1.8vmin,16px);
    letter-spacing:.3em;
    padding-left:.3em;
    font-weight:300;
    color:rgba(255,238,222,.4);
    transition:opacity 1.2s ease, color 1.2s ease;
  }
  .breath-word.show{opacity:1}
  .breath-word.faint{color:rgba(255,238,222,.25)}

  .sound{
    position:fixed;right:22px;bottom:22px;
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,235,220,.1);
    background:transparent;
    color:rgba(255,235,220,.26);
    cursor:pointer;display:grid;place-items:center;padding:0;
    transition:color .5s ease,border-color .5s ease,background .5s ease;
  }
  .sound:hover{color:rgba(255,235,220,.55);border-color:rgba(255,235,220,.2)}
  .sound.on{color:rgba(255,212,172,.8);border-color:rgba(255,204,166,.28);background:rgba(255,190,140,.04)}

  .ripple{
    position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;
    border-radius:50%;border:1px solid rgba(255,200,160,.4);
    pointer-events:none;
    animation:rippleOut 3s cubic-bezier(.2,.6,.3,1) forwards;
  }
  @keyframes rippleOut{
    0%{transform:scale(1);opacity:.75}
    100%{transform:scale(34);opacity:0}
  }

  @media (prefers-reduced-motion: reduce){
    .drift{animation:fadeIn 3.2s ease .4s forwards}
    .breathe{transform:scale(.8);opacity:.7}
    .guide-text{transition-duration:.5s}
    .breath-word{transition-duration:.5s}
    .ripple{animation-duration:1.2s}
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="drift">
      <div class="breathe" id="breathe">
        <div class="halo"></div>
        <div class="core"></div>
        <div class="spark"></div>
      </div>

      <div class="text-area" aria-hidden="true">
        <div class="guide-text" id="guideText">
          <span class="line1">跟着光球呼吸</span>
          <span class="line2">不用做任何事</span>
        </div>
        <span class="breath-word" id="wordIn">吸</span>
        <span class="breath-word" id="wordOut">呼</span>
      </div>
    </div>
  </main>

  <button class="sound" id="sound" aria-label="粉红噪声开关" title="粉红噪声">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6.5 9H3v6h3.5L11 19z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
  </button>

<script>
(function(){
  'use strict';

  var breathe   = document.getElementById('breathe');
  var guideText = document.getElementById('guideText');
  var wordIn    = document.getElementById('wordIn');
  var wordOut   = document.getElementById('wordOut');
  var allWords  = [wordIn, wordOut];
  var soundBtn  = document.getElementById('sound');

  var reduceMotion = window.matchMedia &&
                     window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var MIN_SCALE   = reduceMotion ? 0.8 : 0.62;
  var MIN_OPACITY = reduceMotion ? 0.7 : 0.5;
  var MAX_SCALE   = 1;
  var MAX_OPACITY = 1;

  var tGuide1 = null, tGuide2 = null, tGuide3 = null;
  var tBreath1 = null, tBreath2 = null;

  function setState(scale, opacity, dur, easing){
    breathe.style.transitionDuration = dur + 'ms';
    breathe.style.transitionTimingFunction = easing || 'cubic-bezier(.37,0,.63,1)';
    breathe.style.transform = 'scale(' + scale + ')';
    breathe.style.opacity = opacity;
  }

  function clearGuideTimers(){
    clearTimeout(tGuide1); clearTimeout(tGuide2); clearTimeout(tGuide3);
    tGuide1 = tGuide2 = tGuide3 = null;
  }

  function clearBreathTimers(){
    clearTimeout(tBreath1); clearTimeout(tBreath2);
    tBreath1 = tBreath2 = null;
  }

  function clearAllTimers(){
    clearGuideTimers();
    clearBreathTimers();
  }

  function showWord(el){
    allWords.forEach(function(w){
      if (w === el) w.classList.add('show');
      else w.classList.remove('show');
    });
  }

  function hideWords(){
    allWords.forEach(function(w){ w.classList.remove('show'); });
  }

  /* ========== 呼吸引导 4s 吸 / 6s 呼 ========== */
  var BREATH_INHALE = 4000;
  var BREATH_EXHALE = 6000;

  var cycleCount = 0;
  var SHOW_WORD_FIRST_N = 2;   // 显示两轮
  var FAINT_AFTER = 1;         // 第二轮开始变淡

  function breathInhale(){
    setState(MAX_SCALE, MAX_OPACITY, BREATH_INHALE);
    if (cycleCount < SHOW_WORD_FIRST_N) showWord(wordIn);
    tBreath1 = setTimeout(breathExhale, BREATH_INHALE);
  }

  function breathExhale(){
    setState(MIN_SCALE, MIN_OPACITY, BREATH_EXHALE);
    if (cycleCount < SHOW_WORD_FIRST_N) showWord(wordOut);
    tBreath2 = setTimeout(function(){
      cycleCount++;
      if (cycleCount >= SHOW_WORD_FIRST_N) {
        hideWords();
      } else if (cycleCount >= FAINT_AFTER) {
        // 进入第二轮，文字变淡
        allWords.forEach(function(w){ w.classList.add('faint'); });
      }
      breathInhale();
    }, BREATH_EXHALE);
  }

  function startBreath(){
    clearBreathTimers();
    breathInhale();
  }

  /* ========== 会话流程 ==========
     1.0s  引导文字淡入
     5.0s  引导文字开始淡出（1.4s）
     6.4s  引导文字消失，光球开始第一轮呼吸，“吸”淡入
     16.4s 第一轮结束，进入第二轮，文字变淡
     26.4s 第二轮结束，文字全部退场，只剩光球
  */
  function startSession(){
    clearAllTimers();
    cycleCount = 0;
    hideWords();
    allWords.forEach(function(w){ w.classList.remove('faint'); });
    guideText.classList.remove('show');
    setState(MIN_SCALE, MIN_OPACITY, 0);

    tGuide1 = setTimeout(function(){
      guideText.classList.add('show');
    }, 1000);

    tGuide2 = setTimeout(function(){
      guideText.classList.remove('show');
    }, 5000);

    tGuide3 = setTimeout(function(){
      startBreath();
    }, 6400);
  }

  startSession();

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) {
      clearAllTimers();
    } else {
      startSession();
    }
  });

  /* ========== 点击涟漪 ========== */
  document.addEventListener('pointerdown', function(e){
    if (e.target && e.target.closest && e.target.closest('.sound')) return;
    var r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = e.clientX + 'px';
    r.style.top  = e.clientY + 'px';
    document.body.appendChild(r);
    setTimeout(function(){ r.remove(); }, 3200);
  });

  /* ========== 可选环境音：粉红噪声 ========== */
  var audio = null;

  function initAudio(){
    if (audio) return audio;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;

    var ctx = new Ctx();

    var master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    var bufferSize = 5 * ctx.sampleRate;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);

    var b0, b1, b2, b3, b4, b5, b6;
    b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
    for (var i = 0; i < bufferSize; i++) {
      var white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      var pink = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
      b6 = white * 0.115926;
      data[i] = pink * 0.11;
    }

    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;
    noise.connect(master);
    noise.start();

    audio = { ctx: ctx, master: master, on: false };
    return audio;
  }

  soundBtn.addEventListener('click', function(){
    var a = initAudio();
    if (!a) return;
    if (a.ctx.state === 'suspended') a.ctx.resume();

    var t = a.ctx.currentTime;
    a.master.gain.cancelScheduledValues(t);
    a.master.gain.setValueAtTime(a.master.gain.value, t);

    if (a.on) {
      a.master.gain.linearRampToValueAtTime(0, t + 1.2);
      a.on = false;
      soundBtn.classList.remove('on');
    } else {
      a.master.gain.linearRampToValueAtTime(0.1, t + 2);
      a.on = true;
      soundBtn.classList.add('on');
    }
  });
})();
</script>
</body>
</html>
