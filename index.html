<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>累了吗? - leilema.cn</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --bg-deep: #07090f;
      --bg-mid: #0e1122;
      --accent: #9d8fdb;
      --accent-soft: #b8a9e8;
      --text: #d8d5e8;
      --muted: #7a7588;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: radial-gradient(circle at 50% 45%, var(--bg-mid) 0%, var(--bg-deep) 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-weight: 300;
    }

    /* 全局缓慢呼吸的背景光晕 */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 140vmax;
      height: 140vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(157,143,219,0.08) 0%, transparent 55%);
      animation: ambient 14s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes ambient {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    }

    /* ========== 场景切换 ========== */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 1;
    }
    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ========== 场景1：呼吸 ========== */
    .ball-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ball-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(157,143,219,0.22) 0%, transparent 65%);
      animation: glowBreathe 10s infinite cubic-bezier(0.45, 0, 0.55, 1);
      pointer-events: none;
    }
    @keyframes glowBreathe {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      40% { transform: scale(1.45); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    .ball {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d4c5ff 0%, #a396e8 32%, #6d5fa8 70%, #4a3f7a 100%);
      box-shadow:
        0 0 60px rgba(157,143,219,0.45),
        0 0 120px rgba(157,143,219,0.2),
        0 0 200px rgba(157,143,219,0.08),
        inset 0 0 24px rgba(255,255,255,0.08);
      animation: breathe 10s infinite cubic-bezier(0.45, 0, 0.55, 1);
      cursor: pointer;
      transition: box-shadow 1s ease;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.55); }
      100% { transform: scale(1); }
    }
    .breath-text {
      color: var(--text);
      font-size: 1.35rem;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      margin-top: 1.5rem;
      min-height: 2em;
      text-align: center;
      font-weight: 200;
      opacity: 1;
      transition: opacity 0.5s ease;
      text-shadow: 0 0 20px rgba(157,143,219,0.3);
    }

    /* ========== 场景2：对自己说一句话 ========== */
    .kindness-box {
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .kindness-box .prompt {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.9;
      margin-bottom: 1.8rem;
      letter-spacing: 0.05em;
      font-weight: 300;
    }
    .kindness-box textarea {
      width: 100%;
      min-height: 110px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      color: var(--text);
      padding: 1.1rem 1.2rem;
      font-size: 1rem;
      line-height: 1.7;
      resize: none;
      outline: none;
      font-family: inherit;
      font-weight: 300;
      letter-spacing: 0.02em;
      transition: border-color 0.6s ease, background 0.6s ease;
    }
    .kindness-box textarea::placeholder {
      color: rgba(122,117,136,0.6);
    }
    .kindness-box textarea:focus {
      border-color: rgba(157,143,219,0.5);
      background: rgba(255,255,255,0.06);
    }
    .kindness-box .send-btn {
      margin-top: 1.3rem;
      background: transparent;
      color: var(--accent-soft);
      border: 1px solid rgba(157,143,219,0.4);
      padding: 0.7rem 2.2rem;
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 300;
      letter-spacing: 0.15em;
      transition: background 0.5s ease, border-color 0.5s ease, transform 0.3s ease, color 0.5s ease;
    }
    .kindness-box .send-btn:hover {
      background: rgba(157,143,219,0.12);
      border-color: var(--accent-soft);
      color: #d8d0f5;
    }
    .kindness-box .send-btn:active {
      transform: scale(0.97);
    }

    /* ========== 底部导航 ========== */
    .nav {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2rem;
      align-items: center;
      z-index: 20;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      cursor: pointer;
      padding: 0.5rem 0.6rem;
      transition: color 0.6s ease, text-shadow 0.6s ease;
      font-family: inherit;
      font-weight: 300;
    }
    .nav-btn.active {
      color: var(--text);
      text-shadow: 0 0 12px rgba(157,143,219,0.4);
    }
    .nav-btn:hover {
      color: var(--accent-soft);
    }

    /* ========== 声波按钮 ========== */
    .sound-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.6s ease, border-color 0.6s ease, transform 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      align-self: center;
      position: relative;
    }
    .sound-btn:active {
      transform: scale(0.92);
    }
    .sound-btn.active {
      background: rgba(157,143,219,0.15);
      border-color: rgba(157,143,219,0.6);
    }
    .sound-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.6s ease;
    }
    .sound-btn.active svg {
      stroke: var(--accent-soft);
    }
    .sound-btn.active::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(157,143,219,0.6);
      animation: ripple 2.4s infinite ease-out;
    }
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* ========== 飞走的纸飞机 ========== */
    .plane {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      color: #2a2535;
      padding: 0.85rem 1.6rem;
      border-radius: 22px;
      max-width: 80%;
      word-break: break-word;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      animation: flyUp 5s ease-in forwards;
      z-index: 200;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    @keyframes flyUp {
      0% { bottom: 100px; opacity: 0; transform: translateX(-50%) scale(0.9); }
      15% { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { bottom: 95vh; opacity: 0; transform: translateX(-50%) scale(0.85); }
    }
  </style>
</head>
<body>

  <!-- ========== 场景1：呼吸 ========== -->
  <div class="scene active" id="scene-breath">
    <div class="ball-wrapper">
      <div class="ball-glow"></div>
      <div class="ball" id="ball"></div>
    </div>
    <div class="breath-text" id="breath-phase">吸气</div>
  </div>

  <!-- ========== 场景2：对自己说一句话 ========== -->
  <div class="scene" id="scene-kindness">
    <div class="kindness-box">
      <p class="prompt">
        写一句接纳自己的话，<br>
        写什么都可以。写完它会飘走。
      </p>
      <textarea id="kindness-input" placeholder="例如：今天累了就累了，没关系。"></textarea>
      <button class="send-btn" id="kindness-send">让它飘走</button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="nav">
    <button class="nav-btn active" data-scene="breath">呼吸</button>
    <button class="nav-btn" data-scene="kindness">说一句话</button>
    <button class="sound-btn" id="sound-toggle" aria-label="声音开关">
      <svg viewBox="0 0 24 24">
        <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/>
        <path d="M15 9a4 4 0 010 6" />
        <path d="M18 7a8 8 0 010 10" />
      </svg>
    </button>
  </div>

  <script>
    (function() {
      // ========== 呼吸同步（文字淡入淡出） ==========
      const breathPhaseEl = document.getElementById('breath-phase');
      const ball = document.getElementById('ball');
      const CYCLE = 10;
      let breathStart = Date.now();
      let currentPhase = '吸气';

      function setBreathText(text) {
        if (text === currentPhase) return;
        currentPhase = text;
        breathPhaseEl.style.opacity = '0';
        setTimeout(() => {
          breathPhaseEl.textContent = text;
          breathPhaseEl.style.opacity = '1';
        }, 400);
      }

      function updateBreathPhase() {
        const elapsed = (Date.now() - breathStart) / 1000;
        const cycle = elapsed % CYCLE;
        if (cycle < 4) {
          setBreathText('吸气');
        } else {
          setBreathText('呼气');
        }
      }
      setInterval(updateBreathPhase, 100);

      ball.addEventListener('click', () => {
        breathStart = Date.now();
        ball.style.animation = 'none';
        void ball.offsetWidth;
        ball.style.animation = '';
      });

      // ========== 场景切换 ==========
      const scenes = {
        breath: document.getElementById('scene-breath'),
        kindness: document.getElementById('scene-kindness')
      };
      const navBtns = document.querySelectorAll('.nav-btn');

      function showScene(name) {
        Object.keys(scenes).forEach(k => {
          scenes[k].classList.toggle('active', k === name);
        });
        navBtns.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.scene === name);
        });
      }

      navBtns.forEach(btn => {
        btn.addEventListener('click', () => showScene(btn.dataset.scene));
      });

      // ========== 树洞 ==========
      document.getElementById('kindness-send').addEventListener('click', () => {
        const input = document.getElementById('kindness-input');
        const text = input.value.trim();
        if (!text) return;
        const plane = document.createElement('div');
        plane.className = 'plane';
        plane.textContent = text;
        document.body.appendChild(plane);
        setTimeout(() => plane.remove(), 5000);
        input.value = '';
      });

      // ========== 声音（HTML5 Audio 粉红噪音） ==========
      const soundBtn = document.getElementById('sound-toggle');
      let noiseAudio = null;
      let isPlaying = false;

      function generatePinkNoiseWav(durationSec, sampleRate) {
        const numSamples = Math.floor(durationSec * sampleRate);
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        function writeString(offset, str) {
          for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
          }
        }
        writeString(0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, numSamples * 2, true);

        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < numSamples; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          const pink = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
          b6 = white * 0.115926;
          const sample = Math.max(-1, Math.min(1, pink));
          view.setInt16(44 + i * 2, sample * 0x7FFF, true);
        }
        return new Blob([buffer], { type: 'audio/wav' });
      }

      function startNoise() {
        if (noiseAudio) {
          noiseAudio.play().catch(() => {});
          isPlaying = true;
          soundBtn.classList.add('active');
          return;
        }
        const wavBlob = generatePinkNoiseWav(30, 22050);
        const url = URL.createObjectURL(wavBlob);
        noiseAudio = new Audio(url);
        noiseAudio.loop = true;
        noiseAudio.volume = 0.7;
        noiseAudio.play().then(() => {
          isPlaying = true;
          soundBtn.classList.add('active');
        }).catch(() => {});
      }

      function stopNoise() {
        if (noiseAudio) {
          noiseAudio.pause();
          noiseAudio.currentTime = 0;
        }
        isPlaying = false;
        soundBtn.classList.remove('active');
      }

      soundBtn.addEventListener('click', () => {
        if (isPlaying) stopNoise();
        else startNoise();
      });

      window.addEventListener('beforeunload', () => {
        if (noiseAudio) {
          noiseAudio.pause();
          if (noiseAudio.src) URL.revokeObjectURL(noiseAudio.src);
        }
      });
    })();
  </script>
</body>
</html>
