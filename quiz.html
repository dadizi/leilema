<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>疲劳程度自测 - 累了吗</title>
    <meta name="description" content="快速了解你的身体状态，进行疲劳程度自测">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 10a40 40 0 1 0 40 40 40 40 0 0 1-25 8A40 40 0 0 1 50 10z' fill='%23c4956a'/></svg>" type="image/svg+xml">
    
    <link rel="stylesheet" href="common.css">
    
    <style>
        .page { padding-top: 0; }
        
        .hero {
            padding: 60px 0 40px;
            text-align: center;
            position: relative;
        }

        .hero-title {
            font-size: clamp(28px, 6vw, 44px);
            font-weight: 200;
            letter-spacing: 0.06em;
            color: #f5ede0;
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 15px;
            color: var(--text-muted);
            font-style: italic;
            font-family: var(--font-serif);
        }

        .back-link {
            display: inline-block;
            font-size: 12px;
            color: var(--text-dim);
            text-decoration: none;
            letter-spacing: 0.06em;
            margin-bottom: 32px;
            opacity: 0.6;
            transition: all 0.25s ease;
        }

        .back-link:hover {
            opacity: 1;
            color: var(--accent);
        }

        .section { padding: 32px 0 40px; }

        .section-intro {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 32px;
            font-style: italic;
            font-family: var(--font-serif);
            border-left: 3px solid rgba(201, 154, 122, 0.3);
            padding-left: 20px;
            line-height: 1.8;
        }

        .quiz-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px 28px;
            border: 1px solid var(--border);
            margin-top: 24px;
        }

        .quiz-progress {
            font-size: 12px;
            color: var(--text-dim);
            font-family: var(--font-en);
            letter-spacing: 0.06em;
            margin-bottom: 24px;
            text-align: right;
        }

        .quiz-progress-current {
            color: var(--accent);
            font-weight: 600;
            font-size: 14px;
        }

        .quiz-question {
            font-size: 17px;
            color: #f0e8dc;
            line-height: 1.6;
            margin-bottom: 28px;
            text-align: center;
            min-height: 60px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .quiz-option {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            color: var(--text-muted);
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.02em;
        }

        .quiz-option:hover {
            border-color: rgba(201, 154, 122, 0.4);
            background: rgba(201, 154, 122, 0.05);
            color: #f0e8dc;
        }

        .quiz-option.selected {
            border-color: var(--accent);
            background: rgba(201, 154, 122, 0.1);
            color: var(--accent);
        }

        .quiz-nav {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .quiz-btn {
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: 0.03em;
            border: none;
        }

        .quiz-btn-primary {
            background: var(--accent);
            color: #1a1d22;
        }

        .quiz-btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
        }

        .quiz-btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .quiz-btn-secondary:hover {
            border-color: rgba(201, 154, 122, 0.4);
            color: #f0e8dc;
        }

        .quiz-result {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px 28px;
            border: 1px solid var(--border);
            margin-top: 24px;
            text-align: center;
        }

        .result-score {
            margin-bottom: 24px;
        }

        .result-score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            background: rgba(201, 154, 122, 0.08);
        }

        .result-score-number {
            font-size: 36px;
            font-weight: 300;
            color: var(--accent);
            line-height: 1;
        }

        .result-score-label {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 0.06em;
        }

        .result-level {
            font-size: 18px;
            font-weight: 500;
            color: #f0e8dc;
            letter-spacing: 0.04em;
        }

        .result-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 28px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-suggestions {
            text-align: left;
            background: rgba(201, 154, 122, 0.05);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 24px;
        }

        .result-suggestions h4 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .result-suggestions ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-suggestions li {
            font-size: 14px;
            color: var(--text-muted);
            padding: 8px 0 8px 20px;
            position: relative;
            line-height: 1.6;
        }

        .result-suggestions li::before {
            content: '·';
            position: absolute;
            left: 0;
            color: var(--accent);
        }

        .result-categories {
            margin-bottom: 20px;
        }

        .category-item {
            margin-bottom: 16px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .category-name {
            font-size: 13px;
            color: var(--text-muted);
        }

        .category-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .category-status.良好 {
            background: rgba(100, 200, 150, 0.15);
            color: #64c896;
        }

        .category-status.一般 {
            background: rgba(201, 154, 122, 0.15);
            color: var(--accent);
        }

        .category-status.严重 {
            background: rgba(220, 100, 100, 0.15);
            color: #dc6464;
        }

        .category-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .category-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), rgba(201, 154, 122, 0.5));
            border-radius: 3px;
            transition: width 0.8s ease-out;
        }

        .category-score {
            font-size: 11px;
            color: var(--text-dim);
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="page">
        <a href="/" class="back-link">← 返回首页</a>
        
        <section class="hero">
            <h1 class="hero-title">疲劳程度自测</h1>
            <p class="hero-subtitle">了解你的身体状态</p>
        </section>

        <section class="section">
            <p class="section-intro">花1分钟回答以下问题，了解你的疲劳程度——</p>

            <div class="quiz-container" id="fatigue-quiz">
                <div class="quiz-progress">
                    <span class="quiz-progress-current" id="quiz-current">1</span>
                    <span class="quiz-progress-total">/ 10</span>
                </div>

                <div class="quiz-question" id="quiz-question">
                    <p>过去一周，你平均每天睡几个小时？</p>
                </div>

                <div class="quiz-options" id="quiz-options">
                    <button class="quiz-option" data-value="0">7小时以上</button>
                    <button class="quiz-option" data-value="1">5-7小时</button>
                    <button class="quiz-option" data-value="2">3-5小时</button>
                    <button class="quiz-option" data-value="3">3小时以下</button>
                </div>

                <div class="quiz-nav">
                    <button class="quiz-btn quiz-btn-secondary" id="quiz-prev" style="display: none;">上一题</button>
                    <button class="quiz-btn quiz-btn-primary" id="quiz-next">下一题</button>
                    <button class="quiz-btn quiz-btn-primary" id="quiz-submit" style="display: none;">查看结果</button>
                </div>
            </div>

            <div class="quiz-result" id="quiz-result" style="display: none;">
                <div class="result-score">
                    <div class="result-score-circle" id="result-circle">
                        <span class="result-score-number" id="result-number">0</span>
                        <span class="result-score-label">分</span>
                    </div>
                    <div class="result-level" id="result-level"></div>
                </div>
                <p class="result-desc" id="result-desc"></p>
                <div class="result-suggestions" id="result-suggestions"></div>
                <button class="quiz-btn quiz-btn-secondary" id="quiz-restart">重新测试</button>
            </div>
        </section>
    </div>

    <script>
        (function() {
            const questions = [
                {
                    question: '过去一周，你平均每天睡几个小时？',
                    options: ['7小时以上', '5-7小时', '3-5小时', '3小时以下'],
                    values: [0, 1, 2, 3],
                    category: 'sleep'
                },
                {
                    question: '你最近是否经常感到注意力不集中？',
                    options: ['从不', '偶尔', '经常', '总是'],
                    values: [0, 1, 2, 3],
                    category: 'mental'
                },
                {
                    question: '你身体的疲劳感持续多久了？',
                    options: ['不到一周', '1-2周', '2-4周', '超过4周'],
                    values: [0, 1, 2, 3],
                    category: 'duration'
                },
                {
                    question: '你是否经常感到情绪低落或烦躁？',
                    options: ['从不', '偶尔', '经常', '总是'],
                    values: [0, 1, 2, 3],
                    category: 'emotion'
                },
                {
                    question: '你每天能抽出多少时间放松？',
                    options: ['1小时以上', '30-60分钟', '10-30分钟', '几乎没有'],
                    values: [0, 1, 2, 3],
                    category: 'relax'
                },
                {
                    question: '你是否经常感到肌肉酸痛或身体僵硬？',
                    options: ['从不', '偶尔', '经常', '总是'],
                    values: [0, 1, 2, 3],
                    category: 'physical'
                },
                {
                    question: '你最近的睡眠质量如何？',
                    options: ['很好，一觉到天亮', '一般，偶尔醒', '较差，经常醒', '很差，难以入睡'],
                    values: [0, 1, 2, 3],
                    category: 'sleep'
                },
                {
                    question: '你是否感觉记忆力下降或反应变慢？',
                    options: ['从不', '偶尔', '经常', '总是'],
                    values: [0, 1, 2, 3],
                    category: 'mental'
                },
                {
                    question: '你每天工作/学习时间大约是？',
                    options: ['6小时以内', '6-8小时', '8-10小时', '10小时以上'],
                    values: [0, 1, 2, 3],
                    category: 'workload'
                },
                {
                    question: '你是否经常感到心慌或胸闷？',
                    options: ['从不', '偶尔', '经常', '总是'],
                    values: [0, 1, 2, 3],
                    category: 'physical'
                }
            ];

            const results = [
                {
                    level: '精力充沛',
                    emoji: '🌞',
                    range: [0, 5],
                    desc: '你的身体状态很好！精力充沛，身心都处于良好的平衡状态。继续保持健康的生活习惯，注意劳逸结合。',
                    suggestions: [
                        '保持规律的作息时间，固定入睡和起床时间',
                        '继续坚持运动习惯，每周至少3次适度锻炼',
                        '注意饮食均衡，多摄入蔬菜水果和优质蛋白',
                        '保持良好的心态，定期与朋友家人交流'
                    ]
                },
                {
                    level: '轻度疲劳',
                    emoji: '🌤️',
                    range: [6, 11],
                    desc: '身体发出了轻微的疲劳信号。虽然目前影响不大，但长期积累可能会导致问题。是时候放慢脚步，给自己一些休息的时间了。',
                    suggestions: [
                        '保证充足的睡眠（7-8小时），提高睡眠质量',
                        '每天花10分钟做深呼吸或简单冥想',
                        '减少不必要的加班，学会拒绝',
                        '每周安排一天完全放松，做自己喜欢的事',
                        '每隔1小时站起来活动5分钟'
                    ]
                },
                {
                    level: '中度疲劳',
                    emoji: '🌥️',
                    range: [12, 17],
                    desc: '身体已经相当疲惫了，需要认真对待。长期疲劳会影响身心健康，现在开始调整还来得及。你的身体在呼唤休息，请倾听它的声音。',
                    suggestions: [
                        '立即补觉，保证充足休息',
                        '考虑短期休假调整状态',
                        '减少社交媒体使用时间，睡前1小时远离屏幕',
                        '尝试冥想或正念练习，每天10-15分钟',
                        '适当补充水分和营养，避免咖啡因依赖',
                        '建立工作和生活的明确界限'
                    ]
                },
                {
                    level: '重度疲劳',
                    emoji: '🌧️',
                    range: [18, 30],
                    desc: '身体已经发出强烈的警告信号，请务必重视！长期超负荷运转会严重损害健康。现在不是逞强的时候，需要立即采取行动保护自己。',
                    suggestions: [
                        '立即停止工作，彻底休息至少一周',
                        '寻求专业医疗建议，进行全面体检',
                        '与家人朋友沟通获取支持，不要独自承受',
                        '重新评估工作和生活的平衡，必要时做出改变',
                        '考虑心理咨询，释放情绪压力',
                        '制定长期恢复计划，逐步调整生活方式'
                    ]
                }
            ];

            const quizContainer = document.getElementById('fatigue-quiz');
            const quizResult = document.getElementById('quiz-result');
            const questionEl = document.getElementById('quiz-question');
            const optionsEl = document.getElementById('quiz-options');
            const currentEl = document.getElementById('quiz-current');
            const prevBtn = document.getElementById('quiz-prev');
            const nextBtn = document.getElementById('quiz-next');
            const submitBtn = document.getElementById('quiz-submit');
            const restartBtn = document.getElementById('quiz-restart');

            let currentQuestion = 0;
            let answers = [];

            function renderQuestion() {
                const q = questions[currentQuestion];
                currentEl.textContent = currentQuestion + 1;
                questionEl.innerHTML = `<p>${q.question}</p>`;
                
                optionsEl.innerHTML = '';
                q.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = option;
                    btn.dataset.value = q.values[index];
                    if (answers[currentQuestion] !== undefined) {
                        btn.classList.toggle('selected', answers[currentQuestion] === q.values[index]);
                    }
                    btn.addEventListener('click', () => selectOption(q.values[index]));
                    optionsEl.appendChild(btn);
                });

                prevBtn.style.display = currentQuestion > 0 ? 'block' : 'none';
                nextBtn.style.display = currentQuestion < questions.length - 1 ? 'block' : 'none';
                submitBtn.style.display = currentQuestion === questions.length - 1 ? 'block' : 'none';
            }

            function selectOption(value) {
                answers[currentQuestion] = value;
                document.querySelectorAll('.quiz-option').forEach(btn => {
                    btn.classList.toggle('selected', parseInt(btn.dataset.value) === value);
                });
            }

            function nextQuestion() {
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    renderQuestion();
                }
            }

            function prevQuestion() {
                if (currentQuestion > 0) {
                    currentQuestion--;
                    renderQuestion();
                }
            }

            function calculateResult() {
                const total = answers.reduce((sum, val) => sum + val, 0);
                const result = results.find(r => total >= r.range[0] && total <= r.range[1]);
                
                const categoryScores = {};
                questions.forEach((q, index) => {
                    if (!categoryScores[q.category]) {
                        categoryScores[q.category] = { score: 0, count: 0 };
                    }
                    categoryScores[q.category].score += answers[index] || 0;
                    categoryScores[q.category].count++;
                });
                
                const categoryLabels = {
                    sleep: '睡眠质量',
                    mental: '精神状态',
                    duration: '疲劳时长',
                    emotion: '情绪状态',
                    relax: '放松时间',
                    physical: '身体状况',
                    workload: '工作负荷'
                };
                
                return { total, ...result, categoryScores, categoryLabels };
            }

            function showResult() {
                const res = calculateResult();
                document.getElementById('result-number').textContent = res.total;
                document.getElementById('result-level').innerHTML = `${res.emoji} ${res.level}`;
                document.getElementById('result-desc').textContent = res.desc;
                
                let categoryHtml = '<h4>维度分析</h4><div class="result-categories">';
                for (const [key, value] of Object.entries(res.categoryScores)) {
                    const avgScore = Math.round((value.score / value.count) * 10) / 10;
                    const maxScore = 3;
                    const percentage = (avgScore / maxScore) * 100;
                    const label = res.categoryLabels[key] || key;
                    
                    let status = '良好';
                    if (avgScore >= 2) status = '严重';
                    else if (avgScore >= 1) status = '一般';
                    
                    categoryHtml += `
                        <div class="category-item">
                            <div class="category-header">
                                <span class="category-name">${label}</span>
                                <span class="category-status ${status.toLowerCase()}">${status}</span>
                            </div>
                            <div class="category-bar">
                                <div class="category-bar-fill" style="width: ${percentage}%"></div>
                            </div>
                            <div class="category-score">${avgScore}/3</div>
                        </div>
                    `;
                }
                categoryHtml += '</div>';
                
                const suggestionsEl = document.getElementById('result-suggestions');
                suggestionsEl.innerHTML = categoryHtml + `<h4>行动建议</h4><ul>${res.suggestions.map(s => `<li>${s}</li>`).join('')}</ul>`;
                
                quizContainer.style.display = 'none';
                quizResult.style.display = 'block';
            }

            function restartQuiz() {
                currentQuestion = 0;
                answers = [];
                quizResult.style.display = 'none';
                quizContainer.style.display = 'block';
                renderQuestion();
            }

            nextBtn.addEventListener('click', nextQuestion);
            prevBtn.addEventListener('click', prevQuestion);
            submitBtn.addEventListener('click', showResult);
            restartBtn.addEventListener('click', restartQuiz);

            renderQuestion();
        })();
    </script>
</body>
</html>
